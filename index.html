<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dorlog Lojistik - Sefer Takip Sistemi</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 font-sans min-h-screen text-slate-800">

    <!-- Üst Bilgi Barı -->
    <header class="bg-blue-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 p-2.5 rounded-lg text-xl shadow-inner">
                    <i class="fa-solid fa-truck-fast"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">Dorlog Lojistik</h1>
                    <p class="text-xs text-blue-200">Bulut Tabanlı Sefer ve Taşıma Takip Sistemi</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span id="connection-status" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Bulut Bağlantısı Aktif
                </span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Sol Kolon: Yeni Sefer Ekleme Formu -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 h-fit">
            <h2 class="text-lg font-semibold text-slate-900 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-circle-plus text-blue-600"></i> Yeni Sefer Kaydı
            </h2>
            
            <form id="sefer-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Tarih</label>
                    <input type="date" id="tarih" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Çekici Plaka</label>
                        <input type="text" id="cekici_plaka" placeholder="34 ABC 12" required class="w-full px-3 py-2 border border-slate-300 rounded-lg uppercase focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Dorse Plaka</label>
                        <input type="text" id="dorse_plaka" placeholder="34 XYZ 34" required class="w-full px-3 py-2 border border-slate-300 rounded-lg uppercase focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Şoför Adı Soyadı</label>
                    <input type="text" id="sofor_adi" placeholder="Ahmet Yılmaz" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Alım Yeri (Liman/Depo)</label>
                    <input type="text" id="alim_yeri" placeholder="Kumport / Ambarlı" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Yükleme Yeri (Fabrika/Acente)</label>
                    <input type="text" id="yukleme_yeri" placeholder="Gebze Organize Sanayi" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Teslim Yeri (Boşaltma)</label>
                    <input type="text" id="teslim_yeri" placeholder="Mersin Limanı" required class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Sefer Durumu</label>
                    <select id="durum" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm bg-white">
                        <option value="Beklemede">Beklemede</option>
                        <option value="Yolda">Yolda</option>
                        <option value="Teslim Edildi">Teslim Edildi</option>
                    </select>
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition shadow-sm flex items-center justify-center gap-2 text-sm">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Seferi Kaydet
                </button>
            </form>
        </section>

        <!-- Sağ Kolon: Arama ve Sefer Listesi -->
        <section class="lg:col-span-2 space-y-4">
            
            <!-- Arama ve Filtre Çubuğu -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="relative w-full sm:w-72">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="fa-solid fa-magnifying-glass text-xs"></i>
                    </span>
                    <input type="text" id="search-input" placeholder="Plaka, şoför veya yer ara..." class="w-full pl-9 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div class="text-sm text-slate-500 font-medium" id="record-count">
                    Toplam Sefer: 0
                </div>
            </div>

            <!-- Tablo Alanı -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 text-slate-600 uppercase text-[11px] tracking-wider border-b border-slate-200">
                                <th class="py-3 px-4 font-semibold">Tarih</th>
                                <th class="py-3 px-4 font-semibold">Plakalar / Şoför</th>
                                <th class="py-3 px-4 font-semibold">Güzergah (Alım / Yükleme / Teslim)</th>
                                <th class="py-3 px-4 font-semibold">Durum</th>
                                <th class="py-3 px-4 font-semibold text-right">İşlem</th>
                            </tr>
                        </thead>
                        <tbody id="sefer-table-body" class="divide-y divide-slate-100 text-sm">
                            <tr>
                                <td colspan="5" class="text-center py-8 text-slate-400">
                                    <i class="fa-solid fa-spinner fa-spin text-xl mb-2"></i>
                                    <p>Veriler yükleniyor...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </section>

    </main>

    <!-- Supabase Entegrasyon Scripti -->
    <script>
        const SUPABASE_URL = "https://igkvszmthfnbvnltzaao.supabase.co";
        const SUPABASE_ANON_KEY = "Sb_publishable_lYyesypAOa1x4UeEIbfGLg_BPqUTMZ9";

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('tarih').valueAsDate = new Date();

        let tumSeferler = [];

        async function seferleriGetir() {
            const { data, error } = await _supabase
                .from('seferler')
                .select('*')
                .order('tarih', { ascending: false });

            if (error) {
                console.error('Veri çekme hatası:', error);
                alert('Seferler yüklenirken bir hata oluştu.');
                return;
            }

            tumSeferler = data || [];
            listeyiEkranaBas(tumSeferler);
        }

        function listeyiEkranaBas(veriler) {
            const tbody = document.getElementById('sefer-table-body');
            document.getElementById('record-count').innerText = `Toplam Sefer: ${veriler.length}`;

            if (veriler.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-slate-400">Kayıtlı sefer bulunamadı.</td></tr>`;
                return;
            }

            tbody.innerHTML = veriler.map(s => {
                let durumRenk = 'bg-amber-100 text-amber-800 border-amber-200';
                if (s.durum === 'Yolda') durumRenk = 'bg-blue-100 text-blue-800 border-blue-200';
                if (s.durum === 'Teslim Edildi') durumRenk = 'bg-emerald-100 text-emerald-800 border-emerald-200';

                const tarihStr = s.tarih ? s.tarih.split('-').reverse().join('.') : '';

                return `
                    <tr class="hover:bg-slate-50/80 transition">
                        <td class="py-3 px-4 text-slate-600 font-medium whitespace-nowrap">${tarihStr}</td>
                        <td class="py-3 px-4">
                            <div class="font-bold text-slate-800">${s.cekici_plaka}</div>
                            <div class="text-xs text-slate-500">Dorse: ${s.dorse_plaka}</div>
                            <div class="text-xs text-blue-600 font-medium mt-0.5"><i class="fa-solid fa-user-gear text-[10px]"></i> ${s.sofor_adi}</div>
                        </td>
                        <td class="py-3 px-4">
                            <div class="text-xs text-slate-500">Alım: <strong class="text-slate-700">${s.alim_yeri}</strong></div>
                            <div class="text-xs text-slate-700 font-medium my-0.5">Yük: ${s.yukleme_yeri}</div>
                            <div class="text-xs text-slate-500">Teslim: <strong class="text-slate-700">${s.teslim_yeri}</strong></div>
                        </td>
                        <td class="py-3 px-4 whitespace-nowrap">
                            <span class="px-2.5 py-1 rounded-full text-xs font-semibold border ${durumRenk}">${s.durum}</span>
                        </td>
                        <td class="py-3 px-4 text-right whitespace-nowrap">
                            <button onclick="seferSil(${s.id})" class="w-8 h-8 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-600 transition inline-flex items-center justify-center" title="Kaydı Sil">
                                <i class="fa-solid fa-trash-can text-xs"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        document.getElementById('sefer-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Kaydediliyor...`;

            const yeniSefer = {
                tarih: document.getElementById('tarih').value,
                cekici_plaka: document.getElementById('cekici_plaka').value.trim().toUpperCase(),
                dorse_plaka: document.getElementById('dorse_plaka').value.trim().toUpperCase(),
                sofor_adi: document.getElementById('sofor_adi').value.trim(),
                alim_yeri: document.getElementById('alim_yeri').value.trim(),
                yukleme_yeri: document.getElementById('yukleme_yeri').value.trim(),
                teslim_yeri: document.getElementById('teslim_yeri').value.trim(),
                durum: document.getElementById('durum').value
            };

            const { error } = await _supabase.from('seferler').insert([yeniSefer]);

            if (error) {
                console.error('Kayıt ekleme hatası:', error);
                alert('Kayıt eklenirken hata oluştu: ' + error.message);
            } else {
                document.getElementById('sefer-form').reset();
                document.getElementById('tarih').valueAsDate = new Date();
                seferleriGetir();
            }

            submitBtn.disabled = false;
            submitBtn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Seferi Kaydet`;
        });

        async function seferSil(id) {
            if (confirm('Bu sefer kaydını silmek istediğinize emin misiniz?')) {
                const { error } = await _supabase.from('seferler').delete().eq('id', id);
                if (error) {
                    alert('Silme sırasında hata oluştu.');
                } else {
                    seferleriGetir();
                }
            }
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            const aramaMetni = e.target.value.toLowerCase();
            const filtrelenmis = tumSeferler.filter(s => 
                s.cekici_plaka.toLowerCase().includes(aramaMetni) ||
                s.dorse_plaka.toLowerCase().includes(aramaMetni) ||
                s.sofor_adi.toLowerCase().includes(aramaMetni) ||
                s.alim_yeri.toLowerCase().includes(aramaMetni) ||
                s.yukleme_yeri.toLowerCase().includes(aramaMetni) ||
                s.teslim_yeri.toLowerCase().includes(aramaMetni)
            );
            listeyiEkranaBas(filtrelenmis);
        });

        seferleriGetir();
    </script>
</body>
</html>
